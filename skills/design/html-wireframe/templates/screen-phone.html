<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- モバイル向け雛形。デスクトップ案件は screen.html を複製すること。 -->
  <!-- TODO: タイトルを「プロジェクト名 — NN 画面名（状態）」に -->
  <title>PJ名 — ① 画面名（状態）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- アイコン: Lucide 公式（バニラJS）。<i data-lucide="..."> を shell.js がインライン SVG に変換する。
       色/サイズは Tailwind の text-* が効く。バージョンは固定（@latest は将来壊れる）。 -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.33.0/dist/umd/lucide.min.js"></script>
  <!-- 共通シェル: 複数画面に出る部分（タブ・モーダル外枠等）の一元定義。
       templates/shell.js を wireframes/assets/shell.js にコピーして使う。 -->
  <script src="assets/shell.js"></script>
  <style>
    body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .note { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    /* lucide の既定は 24px 固定で font-size を無視する。text-* に追従させ、
       本文中のアイコンが単独で改行されないよう inline とベースラインも与える */
    svg.lucide { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; }
    .device-phone { width: 375px; height: 760px; border-radius: 2.5rem; border-width: 8px; }
    /* プレースホルダ用の斜線ハッチ（画像・未確定領域に使う） */
    .ph { background-image: repeating-linear-gradient(45deg, #eee 0 8px, #e4e4e7 8px 16px); }
  </style>
</head>
<!-- 低忠実度: 配色は neutral のまま。構造と要素の有無に集中する。 -->
<body class="bg-neutral-200 text-neutral-800 p-8">

  <!-- ヘッダ: 一覧への戻り導線 + 画面名 + 仕様への相互リンク -->
  <header class="mb-8 max-w-5xl mx-auto">
    <p class="text-sm text-neutral-500 mb-1"><a href="index.html" class="underline">← ワイヤーフレーム一覧</a></p>
    <h1 class="text-2xl font-bold">① 画面名（状態）</h1>
    <p class="text-sm text-neutral-600 mt-1">
      低忠実度。配色・タイポは<strong>未確定</strong>で、構造と要素の有無のみを示す。
      仕様: <span class="note">../../1_spec/xxxx.md</span>
    </p>
  </header>

  <!-- 同一画面の「画面レベル状態」を見比べるときは <section> を複製して横並び（flex-wrap が効く）。
       例: 通常 / 空 / 失敗 を3フレーム。要素レベル状態（入力エラー・モーダル）は1フレーム内で表現する。 -->
  <div class="flex flex-wrap gap-10 justify-center items-start max-w-7xl mx-auto">
    <section>
      <!-- 枠は W×H 固定の箱。flex-1/w-full で潰さない・高さを中身任せにしない。
           中身は下の flex-1 overflow-y-auto で「枠の中だけ」スクロールさせる。 -->
      <div class="device-phone relative bg-white border-neutral-800 shadow-xl overflow-hidden flex flex-col">

        <!-- ステータスバー（雰囲気確認用。実装では OS のものに置き換わる） -->
        <div class="h-7 shrink-0 flex items-center justify-between px-6 text-[11px] text-neutral-400">
          <span>9:41</span>
          <span class="flex items-center gap-1">
            <i data-lucide="wifi"></i>
            <i data-lucide="battery-full"></i>
          </span>
        </div>

        <!-- ヘッダ領域 -->
        <div class="px-5 pt-2 pb-3 border-b border-neutral-200">
          <h3 class="text-xl font-bold">画面タイトル</h3>
          <p class="text-[11px] text-neutral-400">補助情報・並び順など</p>
        </div>

        <!-- コンテンツ領域: 縦1カラム。溢れる場合は overflow-y-auto で枠内スクロール -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3">
          <!-- 別画面へ遷移する要素は goTo() でクリック可能に -->
          <button onclick="goTo('02-next-screen.html', { id: '123' })"
                  class="w-full text-left bg-neutral-100 rounded-lg px-4 py-3 active:opacity-60">
            リスト項目（タップで次画面へ）
          </button>

          <!-- 要素レベル状態の例①: 入力エラーは別フレームにせず、同一フレーム内に併記する -->
          <div>
            <input class="w-full border border-red-400 rounded px-3 py-2" placeholder="数量" />
            <p class="text-[11px] text-red-500 mt-1">在庫を超えています（要素レベル状態 = 同一フレーム内）</p>
          </div>

          <!-- 要素レベル状態の例②: モーダル/トースト等の遷移を伴わない状態は JS で開閉。
               URL ハッシュ（この画面.html#confirmModal）でも開ける（shell.js の深リンク） -->
          <button onclick="wfOpen('confirmModal')"
                  class="text-sm underline text-neutral-500">確認モーダルを開く</button>

          <!-- 画像・未確定領域はハッチで示す -->
          <div class="ph aspect-video rounded-lg border border-neutral-300"></div>
        </div>

        <!-- 下部タブ（グローバルナビ）。中身は shell.js の tabbar builder が生成する。
             複数画面に出る部分をページごとにコピーすると黙って分岐するため、プレースホルダだけ置く。 -->
        <div data-wf="tabbar" data-active="01"></div>

        <!-- 確認ダイアログ（既定は hidden）。外枠は全画面共通なので shell.js が生成し、
             ここには本文だけを書く。phone は幅が枠を超えないよう data-width を絞る。 -->
        <div data-wf="confirm" data-id="confirmModal" data-title="確認しますか？" data-action="OK" data-tone="neutral" data-width="300">
          <p class="text-xs text-neutral-600 mt-2">実行内容や影響範囲をここに書く。</p>
        </div>
      </div>

      <!-- 注釈: この画面/状態の要素ルールを 1〜3 行で。monospace。phone は幅を枠に合わせる。 -->
      <p class="note text-[11px] text-neutral-500 mt-2 max-w-[375px]">
        ・この状態で出す/出さない要素のルールを書く<br>
        ・まだ決まっていない点は「未確定」と明記する<br>
        ・決定とその理由は spec が正。ここには転記せず、spec の該当箇所へリンクする
      </p>
    </section>
  </div>

  <script>
    // 画面遷移ヘルパ: クエリで簡易にパラメータを渡してクリック遷移を再現する
    function goTo(href, params) {
      const qs = params ? '?' + new URLSearchParams(params).toString() : '';
      window.location.href = href + qs;
    }
  </script>

</body>
</html>
